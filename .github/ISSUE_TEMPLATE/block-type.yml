name: Block type proposal
description: A new kind of block, built in or as an opt-in feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Many blocks can be written today with `defineBlock` or an extension, as the custom blocks and extensions docs show. This form is for a block you think Quoin should ship.
  - type: input
    id: name
    attributes:
      label: Block name
      placeholder: Timeline
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What writers use it for
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and markdown
      description: The `data` the block would store, and how it would be written in markdown, if it can be.
      placeholder: |
        data: { events: [{ date: '2026-10-01', title: 'Launch' }] }
        markdown: a list of dated items
    validations:
      required: true
  - type: textarea
    id: editing
    attributes:
      label: Editing and keyboard
      description: How it is typed into or edited, how it is reached and left with the keyboard, and what a screen reader should hear.
  - type: dropdown
    id: where
    attributes:
      label: Where it would live
      options:
        - The main entry
        - An opt-in entry of its own
        - Not sure
