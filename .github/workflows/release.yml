name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The changelog test reads each release out of the tag that published it.
        with:
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Check the tag names the package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run check:css
      - run: npm run check:directives
      - run: npm run check:size
      - run: npm run check:consumer
      - run: npm run check:consumer
        env:
          QUOIN_REACT: '18'
      - name: Upgrade to npm 11, since trusted publishing needs 11.5.1 and Node 22 ships npm 10
        run: npm install -g npm@11
      - name: Publish through npm trusted publishing
        run: npm publish --access public --provenance
