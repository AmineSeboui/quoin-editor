name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The changelog test reads each release out of the tag that published it.
        with:
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage
            !coverage/**/*.html
          retention-days: 7
      - run: npm run check:css
      - run: npm run check:directives
      - run: npm run check:size

  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:consumer
        env:
          QUOIN_REACT: ${{ matrix.react }}

  e2e-shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium firefox webkit
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  e2e-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
      - run: npm run build
      - run: npm run test:e2e:dist
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-dist
          path: playwright-report-dist

  # The branch policy requires a check named e2e, and a shard reports under a name of its own and nothing readable
  # on its own either, so this job stands for the suite: it merges their reports and carries their result.
  e2e:
    runs-on: ubuntu-latest
    needs: [e2e-shards, e2e-dist]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter github,html blob-reports
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: ${{ needs.e2e-shards.result != 'success' || needs.e2e-dist.result != 'success' }}
        run: exit 1

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci && npm run build
      - run: npm ci && npm run build && npm test
        working-directory: demo
      - uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium firefox webkit
          working-directory: demo
      - run: npm run test:e2e
        working-directory: demo
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-playwright-report
          path: demo/playwright-report
